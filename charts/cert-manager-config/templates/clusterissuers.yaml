apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels: {{- include "cert-manager-config.labels" . | nindent 4 }}
spec:
  acme:
    email: {{ .Values.email | quote }}
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: {{ .Values.cloudflareTokenSecret.name | quote }}
              key: {{ .Values.cloudflareTokenSecret.key | quote }}
        selector:
          dnsZones: {{- toYaml .Values.dnsZones | nindent 12 }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels: {{- include "cert-manager-config.labels" . | nindent 4 }}
spec:
  acme:
    email: {{ .Values.email | quote }}
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: {{ .Values.cloudflareTokenSecret.name | quote }}
              key: {{ .Values.cloudflareTokenSecret.key | quote }}
        selector:
          dnsZones: {{- toYaml .Values.dnsZones | nindent 12 }}
