apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.certificate.secretName }}
  namespace: {{ .Values.certificate.namespace }}
  labels: {{- include "cert-manager-config.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.certificate.secretName }}
  issuerRef:
    name: {{ .Values.certificate.issuer }}
    kind: ClusterIssuer
  dnsNames: {{- toYaml .Values.certificate.dnsNames | nindent 4 }}
