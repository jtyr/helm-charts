apiVersion: v1
kind: Pod
metadata:
  name: {{ template "libchart.v1.fullname" . }}-test-connection
  labels: {{- include "libchart.v1.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ template "libchart.v1.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
